[workspace]
resolver = "3"
members = ["crates/norn", "crates/norn-syntax"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
norn-syntax = { path = "crates/norn-syntax" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Local dogfood builds: release semantics without the LTO link cost. A separate
# target dir (target/dogfood), so it never thrashes the pristine fat-LTO
# target/release. `make install` symlinks the driver here.
[profile.dogfood]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = false
